name: Django lms CI/CD Pipeline

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    - name: Run Flake8
      run: flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - name: Check out code
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry
    - name: Cache Poetry dependencies
      uses: actions/cache@v3
      id: cache
      with:
        path: |
          .venv/
          ~/.cache/pypoetry/
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.toml') }}
        restore-keys: |
          ${{ runner.os }}-poetry-
    - name: Install dependencies
      run: |
        poetry install --no-root
    - name: Run tests
      env:
        SECRET_KEY: 'TEST'
        CELERY_BROKER_URL : 'memory://'
      run: |
        cd src
        poetry run coverage run --source='.' manage.py test && poetry run coverage report

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Check out code
      uses: actions/checkout@v3
    - name: Log in to Docker Hub
      run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
    - name: Build Docker image
      run: docker build -t ${{ vars.DOCKER_HUB_REPO_NAME }}:${{ github.sha }} .
    - name: Push Docker image to Docker Hub
      run: docker push ${{ vars.DOCKER_HUB_REPO_NAME }}:${{ github.sha }}
    - name: Push latest tag to Docker Hub
      run: |
        docker tag ${{ vars.DOCKER_HUB_REPO_NAME }}:${{ github.sha }} ${{ vars.DOCKER_HUB_REPO_NAME }}:latest
        docker push ${{ vars.DOCKER_HUB_REPO_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Check out code
      uses: actions/checkout@v3
    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}
    - name: Stop docker-compose containers
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          [[ -d ${{ vars.DEPLOY_DIR }} ]] && cd ${{ vars.DEPLOY_DIR }} || exit 0
          [[ -f  docker-compose.yaml ]] && docker-compose down || exit 0
        EOF
    - name: Copy project files to server
      run: |
        rsync -avz docker-compose.yaml nginx  ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:${{ vars.DEPLOY_DIR }}
    - name: Generate env file
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          echo ""
          cd ${{ vars.DEPLOY_DIR }}
          cat << 'ENV_EOF' > .env
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DEBUG=false
          DATABASE_NAME=online_univer
          DATABASE_USER=db_user
          DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          DATABASE_HOST=db
          DATABASE_PORT=5432
          SUPER_USER_LOGIN_NAME=${{ secrets.SUPER_USER_LOGIN_NAME }}
          SUPER_USER_PASSWORD=${{ secrets.SUPER_USER_PASSWORD }}
          EMAIL_HOST = ${{ vars.EMAIL_HOST }}
          EMAIL_PORT = 465
          EMAIL_HOST_USER = ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD = ${{ secrets.EMAIL_HOST_PASSWORD }}
          EMAIL_USE_TLS = False
          EMAIL_USE_SSL = True
          SERVER_EMAIL = EMAIL_HOST_USER
          DEFAULT_FROM_EMAIL = EMAIL_HOST_USER
          REDIS_LOCATION = "redis://redis:6379/5"
          CELERY_BROKER_URL = "redis://redis:6379/7"
          CELERY_RESULT_BACKEND = "redis://redis:6379/7"
          FRONTEND_SITE_URL = ${{ vars.FRONTEND_SITE_URL }}
          BACKEND_DOCKER_IMAGE = ${{ vars.DOCKER_HUB_REPO_NAME }}:latest
        ENV_EOF
        EOF
    - name: Start docker-compose containers
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          cd ${{ vars.DEPLOY_DIR }}
          docker-compose pull
          docker-compose up --force-recreate -d
        EOF
    - name: Cleanup
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          docker system prune -a -f
        EOF
